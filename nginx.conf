user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
}

http {
        server_tokens off;
        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ssl_protocols TLSv1.2 TLSv1.3; # TLSv1 и TLSv1.1 отключены — устаревшие, POODLE/BEAST
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        access_log /var/log/nginx/access.log;

        gzip on;

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;

        server {
                listen 80;
                server_name uliyanovsk.ru www.uliyanovsk.ru;
                return 301 https://uliyanovsk.ru$request_uri;
        }

        server {
                listen 443 ssl;

                server_name uliyanovsk.ru www.uliyanovsk.ru;

                ssl_certificate /etc/letsencrypt/live/uliyanovsk.ru/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/uliyanovsk.ru/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

                root /var/www/uliyanovsk.ru;
                index index.html index.php;

                error_page 404 /docs/errors/404.html;

                # Макрос заголовков безопасности — повторяем в каждом location,
                # т.к. в nginx add_header из родительского блока server {} не наследуется
                # в дочерние location {}, если в них есть свои add_header (баг/фича nginx).
                # Решение: выносим заголовки безопасности в отдельный include-сниппет
                # ИЛИ повторяем в каждом location. Здесь используем повторение.

                location ~ \.php$ {
                        include snippets/fastcgi-php.conf;
                        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
                        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                        add_header X-Frame-Options "SAMEORIGIN" always;
                        add_header X-Content-Type-Options "nosniff" always;
                        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
                        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://mc.yandex.ru; media-src 'self' blob:; connect-src 'self' https://mc.yandex.ru; frame-src 'self' https://rutube.ru; object-src 'none'; base-uri 'self'; form-action 'self';" always;
                }

                # HTML — всегда проверять актуальность (контент обновляется вручную по FTP)
                location ~* \.html$ {
                        ssi on;
                        ssi_silent_errors on;
                        try_files $uri $uri/ /index.html;
                        add_header Cache-Control "no-cache, must-revalidate" always;
                        add_header Pragma "no-cache" always;
                        add_header Access-Control-Allow-Origin * always;
                        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
                        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                        add_header X-Frame-Options "SAMEORIGIN" always;
                        add_header X-Content-Type-Options "nosniff" always;
                        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
                        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://mc.yandex.ru; media-src 'self' blob:; connect-src 'self' https://mc.yandex.ru; frame-src 'self' https://rutube.ru; object-src 'none'; base-uri 'self'; form-action 'self';" always;
                }

                # JS и CSS — проверять актуальность по ETag (версия в query string на FTP-деплое)
                location ~* \.(js|css)$ {
                        etag on;
                        add_header Cache-Control "no-cache, must-revalidate" always;
                        add_header Access-Control-Allow-Origin * always;
                        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                        add_header X-Frame-Options "SAMEORIGIN" always;
                        add_header X-Content-Type-Options "nosniff" always;
                        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
                        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://mc.yandex.ru; media-src 'self' blob:; connect-src 'self' https://mc.yandex.ru; frame-src 'self' https://rutube.ru; object-src 'none'; base-uri 'self'; form-action 'self';" always;
                }

                # JSON-данные — не кэшировать (обновляются через админку 2-3 раза в неделю)
                location ~* \.json$ {
                        add_header Cache-Control "no-cache, must-revalidate" always;
                        add_header Pragma "no-cache" always;
                        add_header Access-Control-Allow-Origin * always;
                        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                        add_header X-Content-Type-Options "nosniff" always;
                }

                # Картинки, шрифты — кэшировать 30 дней (без immutable, т.к. файлы могут меняться)
                location ~* \.(webp|png|svg|ico|gif|jpg|jpeg|woff|woff2)$ {
                        add_header Cache-Control "public, max-age=2592000" always;
                        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                        add_header X-Content-Type-Options "nosniff" always;
                }

                # Медиафайлы (MP3, MP4) — кэшировать 7 дней
                location ~* \.(mp3|mp4)$ {
                        add_header Cache-Control "public, max-age=604800" always;
                        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                }

                # HLS-стрим — НЕ кэшировать (живой поток)
                location ~* \.(m3u8|ts)$ {
                        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                        add_header Pragma "no-cache" always;
                        add_header Expires "0" always;
                        add_header Access-Control-Allow-Origin * always;
                        try_files $uri $uri/ =404;
                }

                # Основной location
                location / {
                        try_files $uri $uri/ =404;
                        add_header Access-Control-Allow-Origin * always;
                        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
                        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                        add_header X-Frame-Options "SAMEORIGIN" always;
                        add_header X-Content-Type-Options "nosniff" always;
                        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
                        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
                        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://mc.yandex.ru; media-src 'self' blob:; connect-src 'self' https://mc.yandex.ru; frame-src 'self' https://rutube.ru; object-src 'none'; base-uri 'self'; form-action 'self';" always;
                }

                # Закрываем прямой доступ к SSI-включениям
                location /includes/ {
                        deny all;
                        return 404;
                }

                location /stats {
                        rtmp_stat all;
                        rtmp_stat_stylesheet /stat/stat.xsl;
                }
                
                location ~ /\.env {
                        deny all;
                        return 404;
                }
        }
}

rtmp {
        server {
                listen 1935;
                chunk_size 4096;

                application liveStream {
                        live on;
                        drop_idle_publisher 5s;

                        push rtmp://localhost/videoStream/play_720p;
                        exec ffmpeg -i rtmp://localhost/liveStream/$name
                                -c:a copy -c:v libx264 -s 854x480 -b:v 1250k -f flv rtmp://localhost/videoStream/${name}_480p
                                -c:a copy -c:v libx264 -s 640x360 -b:v 700k -f flv rtmp://localhost/videoStream/${name}_360p;
                }

                application videoStream {
                        live on;
                        record off;
                        drop_idle_publisher 5s;

                        hls on;
                        hls_path /var/www/uliyanovsk.ru/video-stream/;
                        hls_nested on;

                        hls_variant _720p BANDWIDTH=3000000;
                        hls_variant _480p BANDWIDTH=1200000;
                        hls_variant _360p BANDWIDTH=600000;
                }

                application liveStreamClosed {
                        live on;
                        drop_idle_publisher 5s;

                        push rtmp://localhost/videoClosed/play_720p;
                        exec ffmpeg -i rtmp://localhost/liveStreamClosed/$name
                                -c:a copy -c:v libx264 -s 854x480 -b:v 1250k -f flv rtmp://localhost/videoClosed/${name}_480p
                                -c:a copy -c:v libx264 -s 640x360 -b:v 700k -f flv rtmp://localhost/videoClosed/${name}_360p;
                }

                application videoClosed {
                        live on;
                        record off;
                        drop_idle_publisher 5s;

                        hls on;
                        hls_path /var/www/uliyanovsk.ru/video-closed/;
                        hls_nested on;

                        hls_variant _720p BANDWIDTH=3000000;
                        hls_variant _480p BANDWIDTH=1200000;
                        hls_variant _360p BANDWIDTH=600000;
                }
        }
}