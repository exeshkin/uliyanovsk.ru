<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Смена пароля — Админка</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="layout">

    <aside class="sidebar">
      <h2>Церковь Ульяновск</h2>
       <nav>
        <a href="/index.html">Главная</a>
        <a href="/messages.html">Послание</a>
        <a href="/ministers.html">Служители</a>
        <a href="/services.html">Служения</a>
        <a href="/psalms.html">Псалмы</a>
        <a href="/music.html">Музыка</a>
					<a href="/gallery.html">Галерея</a>
        <a href="/stream.html">Трансляция</a>
        <a href="/notify.html">Уведомление</a>
        <a href="/password.html" class="active">Смена пароля</a>
      </nav>
      <div class="sidebar-logout">
        <button onclick="logout()">Выйти</button>
      </div>
    </aside>

    <main class="main-content">
      <h1>Смена пароля</h1>

      <div id="alert"></div>

      <div class="card">
        <h2>Изменить пароль</h2>
        <div class="form-group">
          <label>Текущий пароль</label>
          <input type="password" id="currentPassword" placeholder="Введите текущий пароль">
        </div>
        <div class="form-group">
          <label>Новый пароль</label>
          <input type="password" id="newPassword" placeholder="Минимум 8 символов">
        </div>
        <div class="form-group">
          <label>Повторите новый пароль</label>
          <input type="password" id="newPassword2" placeholder="Повторите новый пароль">
        </div>
        <button class="btn btn-primary" id="saveBtn">Сохранить</button>
      </div>

    </main>
  </div>

  <script src="/js/common.js"></script>
  <script>
    // Проверка авторизации
    fetch('/api/auth/check')
      .then(r => r.json())
      .then(data => {
        if (!data.loggedIn) window.location.href = '/login.html'
      })

    const alertBox = document.getElementById('alert')

    function showAlert(message, type) {
      alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`
      setTimeout(() => alertBox.innerHTML = '', 4000)
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const currentPassword = document.getElementById('currentPassword').value
      const newPassword = document.getElementById('newPassword').value
      const newPassword2 = document.getElementById('newPassword2').value

      if (!currentPassword || !newPassword || !newPassword2) {
        return showAlert('Заполните все поля', 'error')
      }

      if (newPassword !== newPassword2) {
        return showAlert('Новые пароли не совпадают', 'error')
      }

      if (newPassword.length < 8) {
        return showAlert('Новый пароль должен быть не менее 8 символов', 'error')
      }

      const res = await fetch('/api/auth/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentPassword, newPassword })
      })
      const data = await res.json()

      if (data.success) {
        showAlert('Пароль успешно изменён', 'success')
        document.getElementById('currentPassword').value = ''
        document.getElementById('newPassword').value = ''
        document.getElementById('newPassword2').value = ''
      } else {
        showAlert(data.message || 'Ошибка', 'error')
      }
    })
  </script>
</body>
</html>
